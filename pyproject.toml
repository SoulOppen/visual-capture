[project]
name = "booking-visual-audit"
version = "0.1.0"
description = "Capture and audit every renderable Laravel route at four viewports."
requires-python = ">=3.12"
dependencies = [
    "pillow>=11,<13",
    "playwright>=1.55,<2",
]

[project.scripts]
visual-audit = "booking_visual_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking_visual_audit"]
