[project]
name = "visual-capture"
version = "0.1.0"
description = "Capture and download full-page screenshots of any set of URLs at four viewports."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.55,<2",
]

[project.scripts]
visual-capture = "visual_capture.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_capture"]
